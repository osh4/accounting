version: '3.5'

services:
  postgres:
    container_name: db_postgres
    restart: unless-stopped
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /data/postgres
      POSTGRES_DB: ${POSTGRES_DB:-accounting}
    volumes:
      - postgres:/data/postgres
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - postgres
    env_file:
      - ./deploy/db.env

  accountingapi:
    build:
      dockerfile: Dockerfile
      args:
        - JAR_FILE=./target/accounting-0.0.1.jar
      context: .
    container_name: accounting-api
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - postgres
    ports:
      - "8443:8443"
    env_file:
      - ./deploy/api.env

networks:
  postgres:
    driver: bridge

volumes:
  postgres: